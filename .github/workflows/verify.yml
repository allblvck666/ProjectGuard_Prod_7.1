name: Verify ProjectGuard

on:
  push:
    branches: [main, 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: projectguard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOT_TOKEN: '123456:local-test-token-not-real'
      SECRET_KEY: local-test-signing-key-not-production
      JWT_SECRET: local-test-signing-key-not-production
      PROJECTGUARD_TEST_PG_DSN: postgresql://postgres:local-test-only@localhost:5432/projectguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: pip install -r backend/requirements-dev.txt
      - name: Auth, bot and access inventory on SQLite and PostgreSQL
        run: python -m pytest backend/tests -q
      - name: Protection rules and HTTP flows on SQLite
        run: python -m unittest discover -s tests -p 'test_protections.py'
      - name: Protection rules and HTTP flows on PostgreSQL 18
        env:
          DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/projectguard_test
        run: python -m unittest discover -s tests -p 'test_protections.py'
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
