services:
  - type: web
    name: projectguard-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: BOT_TOKEN
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://projectguard-frontend-prod-7-1.onrender.com
      - key: DB_PATH
        value: /tmp/data.sqlite3
      - key: DATABASE_URL
        fromDatabase:
          name: projectguard-db
          property: connectionString

  - type: web
    name: projectguard-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://projectguard-prod-7-1.onrender.com